appId: com.tonebone.app
productName: Tone Bone
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/packs
    to: packs
mac:
  category: public.app-category.music
  target:
    - dmg
    - dir
win:
  target:
    - nsis
    - portable
linux:
  target:
    - AppImage
  category: Audio
