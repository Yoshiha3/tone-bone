appId: com.tonebone.app
productName: Tone Bone
copyright: Copyright © 2026 Tone Bone
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/themes
    to: themes
  - from: resources/sounds
    to: sounds
  - from: build/icon.png
    to: icon.png
artifactName: Tone-Bone-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.music
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Tone-Bone-${version}-${os}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: Tone-Bone-${version}-${os}-${arch}-portable.${ext}
linux:
  icon: build/icon.png
  category: Audio
  target:
    - target: AppImage
      arch:
        - x64
