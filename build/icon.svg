<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Minimal Light clean ceramic tile -->
    <linearGradient id="bg-b-light" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8edf5" />
    </linearGradient>

    <!-- Crisp Minimal Light track palette bars -->
    <linearGradient id="bar-top-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33659b" />
      <stop offset="100%" stop-color="#558bc5" />
    </linearGradient>
    <linearGradient id="bar-mid-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#348472" />
      <stop offset="100%" stop-color="#53ab96" />
    </linearGradient>
    <linearGradient id="bar-bot-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd743d" />
      <stop offset="100%" stop-color="#df9a62" />
    </linearGradient>

    <filter id="shadow-b-light" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#142033" flood-opacity="0.28" />
    </filter>

    <filter id="bar-lift" x="-8%" y="-20%" width="116%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e2c42" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Squircle base -->
  <g filter="url(#shadow-b-light)">
    <rect x="96" y="96" width="832" height="832" rx="188" ry="188" fill="url(#bg-b-light)" />
  </g>

  <!-- Crisp vertical playhead accent -->
  <rect x="500" y="206" width="24" height="612" rx="12" fill="#3b6ea5" fill-opacity="0.26" />

  <!-- Three bold piano-roll bars -->
  <g filter="url(#bar-lift)">
    <!-- Top bar (Melody - Slate Blue) -->
    <rect x="380" y="274" width="416" height="120" rx="60" fill="url(#bar-top-l)" />

    <!-- Middle bar (Harmony - Sage Teal) -->
    <rect x="228" y="452" width="440" height="120" rx="60" fill="url(#bar-mid-l)" />

    <!-- Bottom bar (Rhythm - Warm Amber) -->
    <rect x="344" y="630" width="320" height="120" rx="60" fill="url(#bar-bot-l)" />
  </g>

  <!-- Subtle outer rim -->
  <rect
    x="98"
    y="98"
    width="828"
    height="828"
    rx="186"
    ry="186"
    fill="none"
    stroke="#cbd5e4"
    stroke-width="4"
  />
</svg>
