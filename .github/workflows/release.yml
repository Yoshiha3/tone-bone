name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Version & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            script: package:mac
          - name: windows
            os: windows-latest
            script: package:win
          - name: linux
            os: ubuntu-latest
            script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package application
        env:
          # Unsigned builds succeed out of the box. Add signing secrets later to enable code signing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        run: npm run ${{ matrix.script }}

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: onkai-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Create Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create or update Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(cat <<'EOF'
          ## ダウンロード

          - **macOS (Apple Silicon / M1–M4)**: `Onkai-*-mac-arm64.dmg`
          - **macOS (Intel)**: `Onkai-*-mac-x64.dmg`
          - **Windows (64-bit インストーラー)**: `Onkai-*-win-x64-setup.exe`
          - **Windows (64-bit ポータブル版)**: `Onkai-*-win-x64-portable.exe`
          - **Linux (64-bit AppImage)**: `Onkai-*-linux-x64.AppImage`

          > **初回起動時の注意（未署名バイナリ）**
          > - **macOS**: 「開発元が未確認」または「壊れているため開けません」と表示される場合は、アプリケーションフォルダへ配置後にターミナルで `xattr -cr "/Applications/Onkai.app"` を実行して起動してください。
          > - **Windows**: SmartScreen の警告が出た場合は「詳細情報」→「実行」を選択してください。
          > - **Linux**: 実行権限を付与（`chmod +x Onkai-*.AppImage`）して起動してください。
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --draft \
              --title "Onkai $TAG" \
              --notes "$NOTES"
          fi
